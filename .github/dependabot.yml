version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"

  # GitHub Actions (keeps the SHA-pinned actions and their version comments updated)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker base images (keeps the digest-pinned FROM lines in the Dockerfile updated)
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Stay on the active Node LTS line; majors are bumped deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
