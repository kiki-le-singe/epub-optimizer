name: Shared quality checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
      - name: Lint, formatting and type checks
        if: matrix.node == '24.x'
        run: |
          pnpm lint
          pnpm format:check
          pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Test with coverage and JUnit reports
        run: pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bash scripts/install-epubcheck.sh epubcheck
      - name: EPUBCheck E2E
        env:
          EPUB_E2E_ARTIFACT_DIR: reports/e2e
        run: |
          mkdir -p reports
          pnpm test:e2e 2>&1 | tee reports/e2e.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-${{ matrix.node }}-${{ github.run_attempt }}
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: warn
