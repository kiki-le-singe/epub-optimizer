name: Shared quality checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify checkout authentication in release worktrees
        if: matrix.node == '24.x'
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          AUTH_WORKTREE_ROOT=$(mktemp -d "$RUNNER_TEMP/epub-worktree-auth.XXXXXX")
          cleanup() {
            if [[ -f "$AUTH_WORKTREE_ROOT/checkout/.git" ]]; then
              git worktree remove --force "$AUTH_WORKTREE_ROOT/checkout"
            fi
            rmdir "$AUTH_WORKTREE_ROOT"
          }
          trap cleanup EXIT
          # Query credential availability without logging the header or making a network request.
          if [[ -z "$(git config --get-urlmatch http.extraheader "$REPOSITORY_URL")" ]]; then
            echo 'Checkout authentication is missing in the main checkout.' >&2
            exit 1
          fi
          git worktree add --detach "$AUTH_WORKTREE_ROOT/checkout" HEAD
          if [[ -z "$(git -C "$AUTH_WORKTREE_ROOT/checkout" config --get-urlmatch http.extraheader "$REPOSITORY_URL")" ]]; then
            echo 'Checkout authentication is missing in the temporary release worktree.' >&2
            exit 1
          fi
          echo 'Checkout authentication is available in temporary release worktrees.'
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
      - name: Lint, formatting and type checks
        if: matrix.node == '24.x'
        run: |
          pnpm lint
          pnpm format:check
          pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Test with coverage and JUnit reports
        run: pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bash scripts/install-epubcheck.sh epubcheck
      - name: EPUBCheck E2E
        env:
          EPUB_E2E_ARTIFACT_DIR: reports/e2e
        run: |
          mkdir -p reports
          pnpm test:e2e 2>&1 | tee reports/e2e.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.node }}-${{ github.run_attempt }}
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: warn
