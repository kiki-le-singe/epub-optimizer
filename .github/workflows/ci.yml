name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install EPUBCheck
        run: |
          EPUBCHECK_VERSION=5.3.0
          curl -L "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip" -o /tmp/epubcheck.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
          mv "/tmp/epubcheck-${EPUBCHECK_VERSION}" epubcheck

      - name: Run EPUBCheck E2E fixture
        run: pnpm test:e2e

      - name: Build Docker image with Compose
        if: matrix.node-version == '24.x'
        run: docker compose build

      - name: Run Docker E2E fixture
        if: matrix.node-version == '24.x'
        run: pnpm test:docker
