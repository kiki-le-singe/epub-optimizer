name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Optional synchronization PR number to test its merge commit
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.pull-request || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.pull-request && format('refs/pull/{0}/merge', inputs.pull-request) || github.sha }}
  docker:
    needs: quality
    uses: ./.github/workflows/docker-check.yml
    with:
      ref: ${{ inputs.pull-request && format('refs/pull/{0}/merge', inputs.pull-request) || github.sha }}
