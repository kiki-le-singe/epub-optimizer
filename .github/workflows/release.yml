name: Release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Must match a prerelease suffix in package.json
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-catalog
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: node --experimental-strip-types scripts/release.ts plan
  quality:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/quality.yml
  images:
    needs: [plan, quality]
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-check.yml
    with:
      candidate: true
  draft:
    needs: [plan, quality, images]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.build == 'false' || (needs.quality.result == 'success' && needs.images.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tested image records
        if: needs.plan.outputs.build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create or resume the draft without changing stable Docker tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: node --experimental-strip-types scripts/release.ts draft
