name: Release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Must match a prerelease suffix in package.json
        required: true
        default: false
        type: boolean
      expected-sha:
        description: Optional source commit returned by Prepare release
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release-catalog
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected-sha }}
        run: node --experimental-strip-types scripts/release.ts plan
  audit:
    needs: plan
    uses: ./.github/workflows/security-audit.yml
  quality:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/quality.yml
  images:
    needs: [plan, audit, quality]
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-check.yml
    with:
      candidate: true
  draft:
    needs: [plan, audit, quality, images]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.audit.result == 'success' && (needs.plan.outputs.build == 'false' || (needs.quality.result == 'success' && needs.images.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tested image records
        if: needs.plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create or resume the draft without changing stable Docker tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: node --experimental-strip-types scripts/release.ts draft
