name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Resolve version from package.json
        run: |
          echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Validate version and tag
        run: >
          node --experimental-strip-types scripts/validate-release.ts
          --version "$VERSION"
          --require-ref refs/heads/main
          --assert-tag-absent
          --assert-remote-tag-absent

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install EPUBCheck
        run: bash scripts/install-epubcheck.sh epubcheck

      - name: Run EPUBCheck E2E fixture
        run: pnpm test:e2e

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Build Docker image with Compose
        run: docker compose build

      - name: Run Docker E2E fixture
        run: pnpm test:docker

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - name: Resolve version from package.json
        run: |
          echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Validate version and tag
        run: >
          node --experimental-strip-types scripts/validate-release.ts
          --version "$VERSION"
          --require-ref refs/heads/main
          --assert-tag-absent
          --assert-remote-tag-absent

      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Build draft release notes from commit history
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)"
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty='- %s' "${PREV_TAG}..v${VERSION}" \
                | { grep -viE '^- (Bump version|Merge )' || true; }
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${VERSION}"
            else
              git log --no-merges --pretty='- %s' "v${VERSION}" \
                | { grep -viE '^- (Bump version|Merge )' || true; }
            fi
          } > release-notes.md
          echo "----- Draft release notes -----"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          RELEASE_TITLE="$VERSION ($(date -u +'%b %e, %Y' | tr -s ' '))"
          gh release create "v$VERSION" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            "${FLAGS[@]}"
