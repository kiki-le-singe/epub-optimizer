name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Validate package version matches tag
        run: >
          node --experimental-strip-types scripts/validate-release.ts
          --tag "${{ github.ref_name }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install EPUBCheck
        run: |
          EPUBCHECK_VERSION=5.3.0
          curl -L "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip" -o /tmp/epubcheck.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
          mv "/tmp/epubcheck-${EPUBCHECK_VERSION}" epubcheck

      - name: Run EPUBCheck E2E fixture
        run: pnpm test:e2e

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Build Docker image with Compose
        run: docker compose build

      - name: Run Docker E2E fixture
        run: pnpm test:docker

  publish:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Validate package version matches tag
        run: >
          node --experimental-strip-types scripts/validate-release.ts
          --tag "${{ github.ref_name }}"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub release ${{ github.ref_name }} already exists."
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag
          fi
